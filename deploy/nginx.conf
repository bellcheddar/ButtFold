# nginx site for ButtFold. Installed to /etc/nginx/sites-available/buttfold by
# deploy.sh --provision, then `certbot --nginx -d buttfold.mdeller.com` adds the TLS block.
#
# Three things on this box that are easy to get wrong and are handled here:
#
#  1. **http2 goes on the listen line.** This droplet runs nginx 1.24.0, where the 1.25.1
#     `http2 on;` directive does not exist. certbot writes the listen directive without it
#     and deploy.sh adds it afterwards, on every deploy, because a renewal can rewrite the
#     line back. That patch is anchored to the start of the line so it cannot rewrite this
#     comment, which is what a loose match did the first time.
#  2. **add_header inside a location REPLACES the ones outside it**, it does not merge. So
#     Cache-Control is set in every location that needs it rather than once at server level.
#  3. **Its own access log.** The launcher counts a hit per app by looking for a request
#     only a rendering browser makes, and a host-less shared log makes that impossible.

server {
    server_name buttfold.mdeller.com;

    access_log /var/log/nginx/buttfold.access.log;
    error_log  /var/log/nginx/buttfold.error.log;

    # Nothing is uploaded. The queue takes a protein id and a seed.
    client_max_body_size 64k;

    # The WASM module, the baked gallery and the styles are served from disk rather than
    # through gunicorn: 842 kB of gallery would otherwise hold a worker for the download.
    location /static/ {
        alias /opt/buttfold/static/;
        include snippets/long-cache.conf;

        # **No `types` block here, deliberately.** A `types` block inside a location
        # REPLACES the whole MIME table rather than adding to it - the same trap as
        # `add_header`, one level up - so the short list that used to be here made every
        # image in /static/ `application/octet-stream`, the screenshot included. nginx
        # 1.24's stock mime.types already maps `.wasm` to application/wasm (line 55 of it),
        # which is the only mapping this app actually needs beyond the defaults, and
        # deploy.sh asserts it on the live site after every deploy.
    }

    # The committed native structures and starting coils the live fold needs.
    location /data/ {
        alias /opt/buttfold/data/;
        include snippets/long-cache.conf;
        default_type application/json;
    }

    # The queue's status must never be cached, by anything, ever.
    location /api/queue {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8007;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The queue's per-IP cap reads this. Set here by nginx and never taken from the
        # client: proxy_add_x_forwarded_for appends the real peer to whatever arrived, and
        # the app takes the LEFT-most entry, so a forged header cannot raise the cap.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
